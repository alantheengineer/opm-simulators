name: docker-image

# Builds the flow image and runs SPE1 under control in it. Runs when the
# image files change; start it by hand to check the image after other
# changes.

on:
  pull_request:
    branches: [deploy]
    paths:
      - docker/**
      - .dockerignore
      - .github/workflows/docker-image.yml
  push:
    branches: [deploy]
    paths:
      - docker/**
      - .dockerignore
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # The build needs more disk than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # The image fetches its dependencies by ref. Passing commits rather than
      # branch names keeps the layer cache from reusing an old build after a
      # branch moves.
      - name: Resolve dependency commits
        id: deps
        run: |
          common=$(git ls-remote "https://github.com/${{ github.repository_owner }}/opm-common.git" refs/heads/deploy | cut -f1)
          grid=$(git ls-remote https://github.com/OPM/opm-grid.git refs/heads/master | cut -f1)
          test -n "$common" && test -n "$grid"
          echo "common=$common" >> "$GITHUB_OUTPUT"
          echo "grid=$grid" >> "$GITHUB_OUTPUT"
          echo "opm-common deploy at $common, opm-grid master at $grid"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: opm-flow:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPM_COMMON_REPO=https://github.com/${{ github.repository_owner }}/opm-common.git
            OPM_COMMON_REF=${{ steps.deps.outputs.common }}
            OPM_GRID_REF=${{ steps.deps.outputs.grid }}
            JOBS=3

      - name: Smoke test
        run: docker/smoke-test.sh opm-flow:test
