name: docker-image

# Builds the flow image and runs SPE1 under control in it. Pull requests
# build it when the image files change. Every push to deploy also publishes
# it as ghcr.io/OWNER/opm-flow, tagged deploy and with the commit.

on:
  pull_request:
    branches: [deploy]
    paths:
      - docker/**
      - .dockerignore
      - .github/upstream-pins.env
      - .github/workflows/docker-image.yml
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      # The build needs more disk than the runner has free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      # The image fetches its dependencies by ref. Passing commits rather than
      # branch names keeps the layer cache from reusing an old build after a
      # branch moves. opm-grid is pinned in .github/upstream-pins.env.
      - name: Resolve dependency commits
        id: deps
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # A sync pull request uses opm-common's sync branch of the same name.
          url="https://github.com/${{ github.repository_owner }}/opm-common.git"
          common=""
          if [[ $HEAD_REF == sync/* ]]; then
            common=$(git ls-remote "$url" "refs/heads/$HEAD_REF" | cut -f1)
          fi
          common=${common:-$(git ls-remote "$url" refs/heads/deploy | cut -f1)}
          grid=$(sed -n 's/^OPM_GRID_REF=//p' .github/upstream-pins.env)
          test -n "$common" && test -n "$grid"
          echo "common=$common" >> "$GITHUB_OUTPUT"
          echo "grid=$grid" >> "$GITHUB_OUTPUT"
          echo "opm-common at $common, opm-grid at $grid"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: opm-flow:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            OPM_COMMON_REPO=https://github.com/${{ github.repository_owner }}/opm-common.git
            OPM_COMMON_REF=${{ steps.deps.outputs.common }}
            OPM_GRID_REF=${{ steps.deps.outputs.grid }}
            JOBS=3

      - name: Smoke test
        run: docker/smoke-test.sh opm-flow:test

      - name: Publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/deploy'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/opm-flow
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in deploy "${{ github.sha }}"; do
            docker tag opm-flow:test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          echo "Published $IMAGE:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
