//
// Control interface for a running flow simulation. Errors use the gRPC
// status codes: INVALID_ARGUMENT for a bad request, FAILED_PRECONDITION when
// the command is not allowed in the current state, UNAVAILABLE when another
// command is in progress, UNAUTHENTICATED for a missing or wrong token, and
// INTERNAL when the simulator fails.

syntax = "proto3";

package opm.control.v1;

service Control {
  rpc GetInfo(GetInfoRequest) returns (InfoReply);
  rpc GetStatus(GetStatusRequest) returns (StatusReply);
  // Runs one report step.
  rpc Step(StepRequest) returns (StatusReply);
  // Runs report steps until the target is reached, a stop condition is met
  // or Cancel is called. Sends the status after each report step; the last
  // one says why it stopped.
  rpc AdvanceTo(AdvanceRequest) returns (stream StatusReply);
  // Stops AdvanceTo at the next report step. Allowed while it runs.
  rpc Cancel(CancelRequest) returns (CancelReply);
  // Ends all ranks with a non-zero exit code, without writing the final
  // output. A running command stops at the next report step first.
  rpc Abort(AbortRequest) returns (AbortReply);
  // Writes the final output. Allowed once, after which only reads and
  // Shutdown are accepted.
  rpc Finish(FinishRequest) returns (StatusReply);
  // Ends all ranks. Finishes first if Finish has not been called.
  rpc Shutdown(ShutdownRequest) returns (ShutdownReply);

  // Cell values at the current report step, streamed in chunks.
  rpc GetCellData(CellDataRequest) returns (stream CellDataChunk);
  rpc GetWellData(WellDataRequest) returns (WellDataReply);
  rpc GetSummary(SummaryRequest) returns (SummaryReply);

  // Applies SCHEDULE section keywords from the next report step on, as if
  // they were written in the deck at that date. Only keywords on the
  // control allow-list are accepted. Nothing is applied if any keyword is
  // refused.
  rpc ApplySchedule(ApplyScheduleRequest) returns (ApplyScheduleReply);
  // Sets the controls of one well by writing a WCONPROD or WCONINJE record
  // for it. Applied as ApplySchedule.
  rpc SetWellControl(WellControlRequest) returns (ApplyScheduleReply);
  // Sets what an injector injects, by writing WSALT, WTRACER and WTEMP
  // records for it. Applied as ApplySchedule.
  rpc SetInjectionComposition(InjectionCompositionRequest) returns (ApplyScheduleReply);
}

message GetInfoRequest {}
message GetStatusRequest {}
message StepRequest {}
message FinishRequest {}
message ShutdownRequest {}
message ShutdownReply {}
message CancelRequest {}
message CancelReply {}

message AbortRequest {
  string reason = 1;
}

message AbortReply {}

message StopCondition {
  enum Comparison {
    COMPARISON_UNSPECIFIED = 0;
    COMPARISON_ABOVE = 1;
    COMPARISON_BELOW = 2;
  }
  // Summary key, for example FOPR or WBHP:PROD.
  string key = 1;
  Comparison comparison = 2;
  // In the units of the SMSPEC file.
  double value = 3;
}

message AdvanceRequest {
  oneof target {
    // Number of completed report steps to reach.
    int32 report_step = 1;
    // The first report step that starts at or after this time, ISO 8601
    // UTC, for example 2027-01-01T00:00:00Z.
    string date = 2;
  }
  // Checked after each report step. Any one met stops the advance.
  repeated StopCondition stop = 3;
}

message InfoReply {
  string engine_version = 1;
  int32 ranks = 2;
  int32 threads_per_rank = 3;
  // Cartesian grid dimensions nx, ny, nz.
  repeated int32 grid_dims = 4;
  int64 active_cells = 5;
  // Start of each report step, ISO 8601 UTC. The last entry is the end of
  // the schedule.
  repeated string report_dates = 6;
  // Deck unit system, for example METRIC or FIELD.
  string unit_system = 7;
}

enum State {
  STATE_UNSPECIFIED = 0;
  STATE_READY = 1;
  STATE_STEPPING = 2;
  STATE_DONE = 3;
  STATE_FINISHED = 4;
  STATE_FAILED = 5;
}

message StatusReply {
  State state = 1;
  // Report steps completed so far.
  int32 report_step = 2;
  int32 report_steps_total = 3;
  // Simulated time since the start of the schedule, seconds.
  double elapsed_seconds = 4;
  // Wall time of the last Step, seconds.
  double last_step_wall_seconds = 5;
  // Set when state is STATE_FAILED.
  string error = 6;
  // Solver work in the last report step.
  StepReport last_step = 7;
  // Set in the last status of AdvanceTo: why it stopped.
  string stop_reason = 8;
}

message StepReport {
  // Accepted time steps.
  int32 time_steps = 1;
  // Time steps that failed and were retried with a shorter step.
  int32 cuts = 2;
  int32 newton_iterations = 3;
  int32 linear_iterations = 4;
  // Newton iterations spent in the failed time steps.
  int32 wasted_newton_iterations = 5;
}

// IJK box, 1-based and inclusive, as in the deck.
message CellBox {
  int32 i1 = 1;
  int32 i2 = 2;
  int32 j1 = 3;
  int32 j2 = 4;
  int32 k1 = 5;
  int32 k2 = 6;
}

message CellIndices {
  // Global active cell indices, 0-based, in the order of the INIT and
  // restart files.
  repeated int64 active = 1;
}

message CellDataRequest {
  // Field names as in the restart file, for example PRESSURE or SWAT.
  repeated string fields = 1;
  // All active cells when neither is set.
  oneof selection {
    CellIndices indices = 2;
    CellBox box = 3;
  }
  // SI units instead of the deck units.
  bool si_units = 4;
}

// The fields are sent one after another, each in one or more chunks.
message CellDataChunk {
  string field = 1;
  string unit = 2;
  // Position of the first value in the selection.
  int64 offset = 3;
  // Number of values in the selection.
  int64 total = 4;
  repeated double values = 5;
  // Active indices of the selected cells. Sent in the first chunk of the
  // reply when the selection is a box.
  repeated int64 cells = 6;
}

message WellDataRequest {
  // Well names. A trailing * matches any suffix. All wells when empty.
  repeated string wells = 1;
}

message WellData {
  string name = 1;
  // OPEN, STOP or SHUT.
  string status = 2;
  bool injector = 3;
  // Active control mode, for example ORAT, RESV or BHP.
  string control = 4;
  // Surface rates. Positive into the reservoir, negative out of it.
  double oil_rate = 5;
  double water_rate = 6;
  double gas_rate = 7;
  double bhp = 8;
  double thp = 9;
  double temperature = 10;
  // Salt mass rate, when the model has brine.
  double salt_rate = 11;
}

message WellDataReply {
  repeated WellData wells = 1;
  // Units of the values above.
  string liquid_rate_unit = 2;
  string gas_rate_unit = 3;
  string pressure_unit = 4;
  string temperature_unit = 5;
  string salt_rate_unit = 6;
}

message SummaryRequest {
  // Summary keys as in the SMSPEC file, for example FOPR or WBHP:PROD.
  // All evaluated keys when empty.
  repeated string keys = 1;
  // The value at every report step so far instead of only the latest.
  bool history = 2;
}

message SummarySeries {
  string key = 1;
  // One value per entry in report_steps, in the units of the SMSPEC file.
  repeated double values = 2;
}

message SummaryReply {
  repeated int32 report_steps = 1;
  // Simulated time since the start of the schedule at each report step,
  // seconds.
  repeated double elapsed_seconds = 2;
  repeated SummarySeries series = 3;
}

message ApplyScheduleRequest {
  // Keywords in deck units, for example
  // "WCONPROD\n 'PROD' 'OPEN' 'ORAT' 15000 4* 1000 /\n/\n".
  string text = 1;
}

message ApplyScheduleReply {
  // The text applied. For SetWellControl, the record that was written.
  string text = 1;
  // Keywords applied, in order.
  repeated string keywords = 2;
  // First report step the change applies to: the next one to run.
  int32 report_step = 3;
  // Wells the change affects.
  repeated string wells = 4;
}

// A WCONPROD record for a producer, or a WCONINJE record when
// injector_type is set. Values are in deck units. As in those keywords,
// a value left out has no limit, so give every limit the well should keep.
message WellControlRequest {
  string well = 1;
  // OPEN, STOP or SHUT. OPEN when empty.
  string status = 2;
  // Producer: ORAT, WRAT, GRAT, LRAT, RESV, BHP or THP.
  // Injector: RATE, RESV, BHP or THP.
  string control = 3;
  // WATER, GAS or OIL for an injector. Empty for a producer.
  string injector_type = 4;
  optional double oil_rate = 5;
  optional double water_rate = 6;
  optional double gas_rate = 7;
  optional double liquid_rate = 8;
  optional double reservoir_rate = 9;
  optional double bhp = 10;
  optional double thp = 11;
  // Injector surface rate.
  optional double surface_rate = 12;
}

// Values are in deck units. Items left out keep their current values.
message InjectionCompositionRequest {
  string well = 1;
  // Salt concentration of the injected water. Needs a model with brine.
  optional double salt_concentration = 2;
  // Tracer name to injected concentration.
  map<string, double> tracers = 3;
  // Temperature of the injected fluid. Needs a thermal model.
  optional double temperature = 4;
}
